<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Definition List</title>
    <style>
       dt
       {
        color: blueviolet;
       }

       dd
       {
            margin-bottom:20px;
       }
    </style>
</head>
<body>
    <h2>Nested Definition List</h2>
    <hr>
    <dl>
       <dt>Programming Languages</dt>
       <dd>C, C++, Java, C#</dd>

       <dt>Databases</dt>
       <dd>MySQL, SQL Server, Oracle, MongoDB</dd>

       <dt>Web Technologies</dt>
       <dd>HTML, CSS, JavaScript, ASP.NET</dd>

       <dt>Cloud Computing</dt>
       <dd>AWS, Microsoft Azure, Google Cloud</dd>
    </dl>
</body>
</html>
