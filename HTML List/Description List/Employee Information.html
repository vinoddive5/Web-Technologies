<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Information</title>
    <style>
        header
        {
            border-bottom: 2px solid black;
            padding: 5px;
            color: red;
        }

        .Container
        {
            padding-left: 10px;
        }

        dd
        {
            margin-bottom: 10px;
        }

        dt
        {
            color: blue;
            font-size: larger;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <header>
        <h3>
            Employee Details
        </h3>
    </header>

    <main>
        <div class="Container">
            <dl>
                <dt>Employee Name</dt>
                <dd>Vinod Dive</dd>

                <dt>Employee ID</dt>
                <dd>101</dd>

                <dt>Department</dt>
                <dd>IT</dd>

                <dt>Designation</dt>
                <dd>Software Developer</dd>

                <dt>Salary</dt>
                <dd>25,000</dd>
            </dl>
        </div>
    </main>
</body>
</html>
