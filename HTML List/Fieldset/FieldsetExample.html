<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset Example</title>
    <style>
        li
       {
            margin-bottom: 5px;
       }
    </style>
</head>
<body>
    <h2 style="color: red;">
        Fieldset Example: Colors and Sports
    </h2>
    <hr>

    <fieldset>
        <legend style="color: cornflowerblue;">List of Colors</legend>
        <ul>
            <li>Red</li>
            <li>Blue</li>
            <li>Green</li>
            <li>Yellow</li>
            <li>Orange</li>
            <li>Purple</li>
            <li>Black</li>
            <li>White</li>
        </ul>
    </fieldset>

    <fieldset>
        <legend style="color: cornflowerblue;">List of Sports</legend>
        <ol>
            <li>Soccer</li>
            <li>Basketball</li>
            <li>Cricket</li>
            <li>Tennis</li>
            <li>Badminton</li>
            <li>Baseball</li>
            <li>Hockey</li>
            <li>Swimming</li>
            <li>Kabaddi</li>
            <li>Volleyball</li>
        </ol>   
    </fieldset>


</body>
</html>
