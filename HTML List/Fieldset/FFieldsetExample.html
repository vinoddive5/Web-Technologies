<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <style>
        li
        {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <h2 style="color: blue;">Student Hobbies and Subjects</h2>
    <hr>
    <fieldset style="margin-bottom: 20px;">
        <legend style="color:cornflowerblue;"> 
            List of Hobbies</legend>
            <ul style="list-style: square;">
                <li>Reading</li>
                <li>Travelling</li>
                <li>Playing Cricket</li>
                <li>Listening to Music</li>
                <li>Drawing</li>
                <li>Cooking</li>
            </ul>
       
    </fieldset>

    <fieldset>
        <legend style="color: cornflowerblue;">
            List of Subjects
            </legend>
            <ol style="list-style-type: lower-alpha;">
                <li>HTML</li>
                <li>CSS</li>
                <li>JAVASCRIPT</li>
                <li>C</li>
                <li>C#</li>
            </ol>
        
    </fieldset>
</body>
</html>
